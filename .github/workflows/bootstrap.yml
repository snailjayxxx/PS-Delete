name: Bootstrap project

on:
  push:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk* | base64 --decode > /tmp/ps-delete-project.tar.gz
          echo "f40c29873c9305c812ab7a6555c308bcb2b8585076eb1f94a18fa8c9464e608c  /tmp/ps-delete-project.tar.gz" | sha256sum --check
          tar -xzf /tmp/ps-delete-project.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit complete project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "开发 Photoshop 与 Lightroom AI 清理插件"
          git push
