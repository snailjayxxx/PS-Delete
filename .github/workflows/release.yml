name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements.txt pytest
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Validate Python
        env:
          PYTHONPATH: core
        run: |
          python -m compileall -q core/joss_ai_cleanup
          pytest -q
      - name: Validate Photoshop package
        run: |
          python -m json.tool PS/manifest.json >/dev/null
          node --check PS/main.js
      - name: Validate Lightroom package
        run: |
          find LR/JossAICleanup.lrplugin -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

  package_plugins:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Photoshop CCX and Lightroom plugin
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          mkdir -p release-dist/ps release-dist/lr
          cp -R PS/. release-dist/ps/
          rm -f release-dist/ps/README.md
          (cd release-dist/ps && zip -r "../Joss-AI-Cleanup-PS-v${VERSION}.ccx" .)
          cp -R LR/JossAICleanup.lrplugin release-dist/lr/
          (cd release-dist/lr && zip -r "../Joss-AI-Cleanup-LR-v${VERSION}.zip" JossAICleanup.lrplugin)
          rm -rf release-dist/ps release-dist/lr
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: release-dist/*
          if-no-files-found: error

  build_core:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: core-macos
            label: macOS-Apple-Silicon
          - os: windows-latest
            artifact: core-windows
            label: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements.txt pyinstaller
      - name: Build local core
        shell: bash
        run: |
          pyinstaller --clean --noconfirm --onefile \
            --name joss-ai-cleanup-core \
            --paths core \
            --collect-all keyring \
            --collect-all jaraco \
            core/build_entry.py
      - name: Package macOS core
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="$(cat VERSION)"
          PKG="release-dist/Joss-AI-Cleanup-Core-macOS-Apple-Silicon"
          mkdir -p "$PKG"
          cp dist/joss-ai-cleanup-core "$PKG/"
          cp scripts/install-macos.command scripts/uninstall-macos.command "$PKG/"
          cp core/README.md "$PKG/README.txt"
          chmod +x "$PKG/joss-ai-cleanup-core" "$PKG"/*.command
          (cd release-dist && zip -r "Joss-AI-Cleanup-Core-macOS-Apple-Silicon-v${VERSION}.zip" "Joss-AI-Cleanup-Core-macOS-Apple-Silicon")
          rm -rf "$PKG"
      - name: Package Windows core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = Get-Content VERSION
          $Pkg = "release-dist/Joss-AI-Cleanup-Core-Windows-x64"
          New-Item -ItemType Directory -Force -Path $Pkg | Out-Null
          Copy-Item dist/joss-ai-cleanup-core.exe $Pkg/
          Copy-Item scripts/install-windows.ps1,scripts/uninstall-windows.ps1 $Pkg/
          Copy-Item core/README.md "$Pkg/README.txt"
          Compress-Archive -Path $Pkg -DestinationPath "release-dist/Joss-AI-Cleanup-Core-Windows-x64-v$Version.zip" -Force
          Remove-Item -Recurse -Force $Pkg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-dist/*.zip
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main'
    needs: [package_plugins, build_core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          ls -lah
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Joss AI Cleanup v0.1.0
          target_commitish: main
          prerelease: true
          generate_release_notes: true
          body: |
            Photoshop 与 Lightroom Classic 的首个可安装技术预览版。

            安装顺序：
            1. 安装对应系统的 Joss AI Cleanup Core。
            2. 安装 Photoshop CCX 或 Lightroom Classic lrplugin。
            3. 在 Photoshop 插件中配置 API Key；Lightroom 会共用本机配置。

            注意：macOS Core 尚未使用 Apple Developer ID 签名和公证；PS CCX 尚未经过 Adobe Marketplace 验证。
          files: release-dist/*
          fail_on_unmatched_files: true
