name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IS_RELEASE_PR: ${{ github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[release] v') && github.event.pull_request.base.ref == 'main' }}

jobs:
  acknowledge:
    if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[release] v') && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge release request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "🚀 已启动 Joss AI Cleanup 构建。\n\n构建记录：$RUN_URL"

  validate:
    if: github.event_name != 'pull_request' || (startsWith(github.event.pull_request.title, '[release] v') && github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Validate release version
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          EXPECTED_TITLE="[release] v${VERSION}"
          if [[ "${{ github.event.pull_request.title }}" != "$EXPECTED_TITLE" ]]; then
            echo "PR 标题必须为：$EXPECTED_TITLE"
            exit 1
          fi
      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements.txt pytest
          sudo apt-get update
          sudo apt-get install -y lua5.1
      - name: Validate Python
        env:
          PYTHONPATH: core
        run: |
          python -m compileall -q core/joss_ai_cleanup
          pytest -q
      - name: Validate Photoshop source
        run: |
          python scripts/validate_ps_package.py PS --version-file VERSION
          node --check PS/main.js
      - name: Validate Lightroom package
        run: |
          find LR/JossAICleanup.lrplugin -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

  package_plugins:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[release] v') && github.event.pull_request.base.ref == 'main')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package Photoshop CCX and developer fallback
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          mkdir -p release-dist/ps
          cp -R PS/. release-dist/ps/
          rm -f release-dist/ps/README.md

          # CCX 必须让 manifest.json 位于压缩包根目录。
          # -X 删除额外文件属性，降低不同平台 ZIP 元数据造成的兼容问题。
          (cd release-dist/ps && zip -X -9 -r "../Joss-AI-Cleanup-PS-v${VERSION}.ccx" .)
          python scripts/validate_ps_package.py "release-dist/Joss-AI-Cleanup-PS-v${VERSION}.ccx" --version-file VERSION

          # 当 Creative Cloud 安装器本身异常时，可在 UXP Developer Tool 中加载此 ZIP 解压目录。
          (cd release-dist/ps && zip -X -9 -r "../Joss-AI-Cleanup-PS-Developer-Load-v${VERSION}.zip" .)
          rm -rf release-dist/ps
      - name: Package Lightroom plugin
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '\r\n' < VERSION)"
          mkdir -p release-dist/lr
          cp -R LR/JossAICleanup.lrplugin release-dist/lr/
          (cd release-dist/lr && zip -X -9 -r "../Joss-AI-Cleanup-LR-v${VERSION}.zip" JossAICleanup.lrplugin)
          rm -rf release-dist/lr
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: release-dist/*
          if-no-files-found: error

  build_core:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[release] v') && github.event.pull_request.base.ref == 'main')
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: core-macos
            label: macOS-Apple-Silicon
          - os: windows-latest
            artifact: core-windows
            label: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: core/requirements.txt
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r core/requirements.txt pyinstaller
      - name: Build local core
        shell: bash
        run: |
          pyinstaller --clean --noconfirm --onefile \
            --name joss-ai-cleanup-core \
            --paths core \
            --collect-all keyring \
            --collect-all jaraco \
            core/build_entry.py
      - name: Package macOS core
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          PKG="release-dist/Joss-AI-Cleanup-Core-macOS-Apple-Silicon"
          mkdir -p "$PKG"
          cp dist/joss-ai-cleanup-core "$PKG/"
          cp scripts/install-macos.command scripts/uninstall-macos.command "$PKG/"
          cp core/README.md "$PKG/README.txt"
          chmod +x "$PKG/joss-ai-cleanup-core" "$PKG"/*.command
          (cd release-dist && zip -X -9 -r "Joss-AI-Cleanup-Core-macOS-Apple-Silicon-v${VERSION}.zip" "Joss-AI-Cleanup-Core-macOS-Apple-Silicon")
          rm -rf "$PKG"
      - name: Package Windows core
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Version = (Get-Content VERSION -Raw).Trim()
          $Pkg = "release-dist/Joss-AI-Cleanup-Core-Windows-x64"
          New-Item -ItemType Directory -Force -Path $Pkg | Out-Null
          Copy-Item dist/joss-ai-cleanup-core.exe $Pkg/
          Copy-Item scripts/install-windows.ps1,scripts/uninstall-windows.ps1 $Pkg/
          Copy-Item core/README.md "$Pkg/README.txt"
          Compress-Archive -Path $Pkg -DestinationPath "release-dist/Joss-AI-Cleanup-Core-Windows-x64-v$Version.zip" -Force
          Remove-Item -Recurse -Force $Pkg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-dist/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[release] v') && github.event.pull_request.base.ref == 'main')
    needs: [package_plugins, build_core]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-dist
          sha256sum * > SHA256SUMS.txt
          ls -lah
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Joss AI Cleanup v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.head.sha || github.sha }}
          prerelease: true
          generate_release_notes: true
          body: |
            修复 Photoshop CCX 安装错误代码 -4。

            原因是 v0.1.0 的 UXP Manifest 将 `host` 写成开发模式数组；v0.1.1 已改为 Adobe 分发要求的单个对象，并在打包前后执行结构校验。

            安装顺序：
            1. 安装对应系统的 Joss AI Cleanup Core。
            2. 双击 Photoshop `.ccx`，或在 Lightroom Classic 中添加 `.lrplugin`。
            3. 在 Photoshop 插件中配置 API Key；Lightroom 会共用本机配置。

            若 Creative Cloud 仍无法调用 CCX 安装器，可下载 `Joss-AI-Cleanup-PS-Developer-Load` ZIP，解压后通过 Adobe UXP Developer Tool 添加其中的 `manifest.json` 并 Load。

            注意：macOS Core 尚未使用 Apple Developer ID 签名和公证；PS CCX 尚未经过 Adobe Marketplace 验证。
          files: release-dist/*
          fail_on_unmatched_files: true

  notify:
    if: always() && github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, '[release] v') && github.event.pull_request.base.ref == 'main'
    needs: [validate, package_plugins, build_core, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Report release result
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_RESULT: ${{ needs.release.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if [[ "$RELEASE_RESULT" == "success" ]]; then
            BODY="✅ Joss AI Cleanup v${VERSION} 已完成构建并发布。\n\n下载：https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}\n构建记录：$RUN_URL"
          else
            BODY="❌ Joss AI Cleanup v${VERSION} 构建或发布失败。\n\n请查看构建记录：$RUN_URL"
          fi
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
